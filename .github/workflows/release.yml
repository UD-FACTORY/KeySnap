name: Release KeySnap

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File Executable
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/

      - name: Package Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/KeySnap.exe, app_icon.ico, README.md -DestinationPath publish/KeySnap-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/KeySnap.exe
            publish/KeySnap-${{ github.ref_name }}-win-x64.zip
          name: KeySnap ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
